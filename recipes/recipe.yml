---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: bazzite-dmhuisma
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bazzite
image-version: stable-44 # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    install:
      packages:
        - micro

  - type: dnf
    install:
      packages:
        # PipeWire/JACK realtime audio stack
        - pipewire-jack-audio-connection-kit
        - pipewire-utils
        - rtkit
        - realtime-setup
        - tuned
        - tuned-profiles-realtime
        - tuna
        # Audio device, routing, and plugin tooling
        - alsa-utils
        - alsa-tools
        - pavucontrol
        - qpwgraph
        - qjackctl
        - Carla
        - guitarix
        - lv2-guitarix-plugins
        - lsp-plugins-lv2
        - lv2-zam-plugins
        - lv2-x42-plugins
        - lv2-calf-plugins
        # Windows VST support for yabridge
        - gcc
        - make
        - wine
        - wine-devel
        - winetricks
        - wine-mono
        - yq
        - cabextract
        - unzip
        - p7zip
        - p7zip-plugins
        - ntsync-autoload

  - type: dnf
    repos:
      copr:
        - scottames/ghostty
    install:
      packages:
        - ghostty
        # Build essentials not already in base image
        # - gcc-c++
        - clang
        - cmake
        - ninja-build
        - gtk3-devel
        # Zephyr / embedded firmware build dependencies
        - dtc
        - gperf
        - dfu-util
        # - python3-pip
        - python3-devel
        - systemd-devel
        - glibc-devel.i686
        # Zephyr native_sim SDL display/input support. sdl2-compat-devel is
        # extracted later to avoid Fedora Mesa devel packages on Bazzite Mesa.
        - sdl2-compat
        - sdl2-compat.i686
        - cpio
        - pkgconf-pkg-config
        # USB access for programmers and debuggers (JLink, nRF, OpenOCD)
        # libusb1-devel is the libusb 1.0 dev package in Fedora (libusb-devel does not exist)
        - libusb1-devel
        - libusb-compat-0.1
        # OpenOCD for JTAG/SWD debugging (complement to JLink)
        - openocd
        # Other
        - python-tkinter
        # VS Code (repo provided via files/system/etc/yum.repos.d/vscode.repo)
        - code
        # Docker CE (repo provided via files/system/etc/yum.repos.d/docker-ce.repo)
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
        - webkit2gtk4.1-devel

  - type: systemd
    system:
      enabled:
        - docker.socket
        - docker.service
        - realtime-setup.service
        - realtime-entsk.service
        - audio-realtime-users.service
      masked:
        - podman.socket
        - podman.service
    user:
      masked:
        - podman.socket
        - podman.service

  - type: script
    scripts:
      - install-arm-toolchain.sh
      - install-zephyr-sdk-17.0.sh
      - install-zephyr-sdk-1.0.1.sh
      - install-sdl2-devel-files.sh
      - install-nrfutil.sh
      - install-jlink.sh
      - install-reaper.sh
      - install-yabridge.sh
      - install-wineasio.sh

  # Enable the Hyprland COPR first. Repositories are retained unless
  # cleanup: true is explicitly requested.
  - type: dnf
    repos:
      copr:
        - lionheartp/Hyprland

  # Install packages that must match Bazzite's customized packages.
  - type: script
    scripts:
      - install-bazzite-devel.sh

  # Install the remaining ordinary Hyprland packages.
  - type: dnf
    install:
      packages:
        - noctalia-hyprland-meta
        - hyprpolkitagent
        - hyprshot
        - hyprqt6engine

  # update noctalia from testing repo
  - type: script
    snippets:
      - dnf -y upgrade --enablerepo=updates-testing noctalia

  - type: justfiles
    validate: true

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
